# ==============================================================================
# Render Infrastructure Blueprint for MORUS-LENS
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  - type: web
    name: morus-lens
    runtime: docker
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
