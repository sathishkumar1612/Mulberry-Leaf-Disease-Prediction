{% extends "base.html" %}

{% block title %}Sign In — MORUS-LENS{% endblock %}

{% block content %}
<div class="auth-page" style="min-height: calc(100vh - 200px); padding: 1rem 0;">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">🍃</div>
      <h1>Welcome to MORUS-LENS</h1>
      <p>Sign in to access your mulberry foliar pathology portal</p>
    </div>

    <form method="POST" action="{{ url_for('login') }}" id="login-form">
      <div class="form-group">
        <label class="form-label" for="username_or_email">Username or Email</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input 
            type="text" 
            class="form-control" 
            id="username_or_email" 
            name="username_or_email" 
            placeholder="Enter your username or email" 
            required 
            autofocus
          >
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input 
            type="password" 
            class="form-control" 
            id="password" 
            name="password" 
            placeholder="Enter your password" 
            required
          >
        </div>
      </div>

      <div class="auth-options">
        <label class="checkbox-label">
          <input type="checkbox" name="remember" id="remember" checked>
          <span>Keep me signed in</span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="btn-submit-login">
        <span>Sign In</span> →
      </button>
    </form>

    <div class="auth-footer">
      <p>Don't have an account yet? <a href="{{ url_for('register') }}" style="font-weight: 600;">Create an account</a></p>
    </div>
  </div>
</div>
{% endblock %}
